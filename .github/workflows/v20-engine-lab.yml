name: v20-engine-lab
on:
  pull_request:
    paths:
      - 'server/v20/**'
      - 'server/local/v20-*.service'
      - 'server/local/ai-suggester.service'
      - 'server/local/legal_style_stage.py'
      - 'server/local/decision_engine.py'
      - 'server/local/safe_diff.py'
      - 'scripts/v20/**'
      - 'tests/v20/**'
      - 'docs/v20/**'
      - '.github/workflows/v20-engine-lab.yml'
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 scripts/v20/verify_static.py
      - run: python3 scripts/v20/verify_static.py --services
      - run: python3 scripts/v20/verify_static.py --docs
      - run: python3 scripts/v20/verify_static.py --ci
      - run: PYTHONPATH=server python3 -m v20.registry --check
      - run: PYTHONPATH=server python3 -m v20.benchmark --self-test
      - run: PYTHONPATH=server python3 -m v20.benchmark --validate-corpus server/v20/cases.jsonl
      - run: python3 scripts/v20/test_legal_style.py
      - run: python3 scripts/v20/test_cloud_contract.py
      - run: bash -n scripts/v20/install.sh scripts/v20/install-worker.sh scripts/v20/benchmark.sh scripts/v20/finalize-main.sh
  network-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r server/cloud/requirements.txt pytest
      - run: PYTHONPATH=server pytest -q tests/test_servers_smoke.py -k 'test_cloud_suggest_with_mocked_openrouter or test_cloud_metrics or test_cloud_missing_key or test_cloud_soft_linebreak_normalized or test_cloud_suggest_appends_end_marker'
