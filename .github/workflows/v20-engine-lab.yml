name: v20-engine-lab
on:
  pull_request:
    paths:
      - 'server/v20/**'
      - 'server/local/v20-*.service'
      - 'scripts/v20/**'
      - 'tests/v20/**'
      - 'docs/v20/**'
      - '.github/workflows/v20-engine-lab.yml'
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 scripts/v20/verify_static.py
      - run: python3 scripts/v20/verify_static.py --services
      - run: python3 scripts/v20/verify_static.py --docs
      - run: python3 scripts/v20/verify_static.py --ci
      - run: PYTHONPATH=server python3 -m v20.registry --check
      - run: PYTHONPATH=server python3 -m v20.benchmark --self-test
      - run: PYTHONPATH=server python3 -m v20.benchmark --validate-corpus tests/v20/cases.jsonl
      - run: bash -n scripts/v20/install.sh scripts/v20/install-worker.sh scripts/v20/benchmark.sh
