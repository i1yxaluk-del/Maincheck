name: patch-main-ui-once
on:
  push:
    branches: [fix/v16-government-and-punctuation-guards]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v16-government-and-punctuation-guards
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Обновить исходник макроса и версию расширения
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('Клиент/AI_Suggester/ai_macro/Main.xba')
          text = main_path.read_text(encoding='utf-8')

          def replace_one(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Ожидалось одно совпадение, найдено {count}: {old[:80]}')
              text = text.replace(old, new)

          replace_one(
              'If aOldFrags(k) <> "" And aNewFrags(k) <> "" Then nFrags = nFrags + 1',
              'If aOldFrags(k) <> "" Then nFrags = nFrags + 1'
          )
          replace_one(
              "    Else\n        ' Нет структурированных правок — применяем целиком, но аккуратно\n        ApplyWholeReplace oSel, sCorrected\n    End If",
              "    Else\n        ' Без локальных пар форматированное выделение не изменяем.\n        MsgBox \"Сервер не вернул безопасных локальных правок. Текст не изменен.\", 48, \"AI Suggester\"\n    End If"
          )
          replace_one(
              '        Dim nPos As Long : nPos = InStr(sCurText, sOld)\n        If nPos = 0 Then',
              '        Dim nPos As Long : nPos = InStr(sCurText, sOld)\n        Dim nNextPos As Long : nNextPos = 0\n        If nPos > 0 Then nNextPos = InStr(nPos + Len(sOld), sCurText, sOld)\n        If nNextPos > 0 Then\n            sSkipped = sSkipped & "  • неоднозначный фрагмент: «" & Left(sOld, 70) & "»" & Chr(10)\n            GoTo NextFrag\n        End If\n        If nPos = 0 Then'
          )

          for old, new in {
              'Dim nW As Integer : nW = 340': 'Dim nW As Integer : nW = 420',
              'Dim nRowH As Integer : nRowH = 12': 'Dim nRowH As Integer : nRowH = 14',
              'Dim nCBStartY As Integer : nCBStartY = 122': 'Dim nCBStartY As Integer : nCBStartY = 92',
              '.Width = nW : .Height = 14': '.Width = nW : .Height = 16',
              '.PositionX = 6 : .PositionY = 17 : .Width = 158 : .Height = 9': '.PositionX = 8 : .PositionY = 18 : .Width = 194 : .Height = 9',
              '.PositionX = 172 : .PositionY = 17 : .Width = 162 : .Height = 9': '.PositionX = 218 : .PositionY = 18 : .Width = 194 : .Height = 9',
              '.PositionX = 6 : .PositionY = 27 : .Width = 158 : .Height = 72': '.PositionX = 8 : .PositionY = 28 : .Width = 194 : .Height = 42',
              '.PositionX = 172 : .PositionY = 27 : .Width = 162 : .Height = 72': '.PositionX = 218 : .PositionY = 28 : .Width = 194 : .Height = 42',
              '.PositionX = 6 : .PositionY = 102 : .Width = nW - 12 : .Height = 9': '.PositionX = 8 : .PositionY = 74 : .Width = nW - 16 : .Height = 10',
              '.Title = "AI Suggester — Предложение по улучшению текста"': '.Title = "AI Suggester — проверка текста"',
          }.items():
              replace_one(old, new)
          if text.count('.FontHeight = 14') != 2:
              raise SystemExit('Не найдены оба размера шрифта панелей')
          text = text.replace('.FontHeight = 14', '.FontHeight = 11')
          main_path.write_text(text, encoding='utf-8')

          desc = Path('Клиент/AI_Suggester/description.xml')
          value = desc.read_text(encoding='utf-8').replace(
              '<version value="1.8.3"/>', '<version value="1.9.0"/>'
          )
          desc.write_text(value, encoding='utf-8')

          tests = Path('tests/test_extension_package.py')
          value = tests.read_text(encoding='utf-8')
          value = value.replace(
              'assert version.get("value") == "1.8.3"',
              'assert version.get("value") == "1.9.0"'
          )
          value = value.replace(
              '    assert "RecordChanges" in body\n',
              '    assert "RecordChanges" in body\n    assert \'And aNewFrags(k) <> ""\' not in body\n    assert "ApplyWholeReplace oSel, sCorrected" not in body\n    assert "nNextPos" in body\n'
          )
          tests.write_text(value, encoding='utf-8')
          PY
      - name: Зафиксировать прямые изменения исходников
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Клиент/AI_Suggester/ai_macro/Main.xba' 'Клиент/AI_Suggester/description.xml' tests/test_extension_package.py
          git commit -m 'feat: обновить интерфейс расширения и безопасное применение [ui-patched]'
          git push
