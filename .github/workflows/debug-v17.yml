name: debug-v17-once
on:
  push:
    branches: [fix/v17-modifier-chain-ui]
permissions:
  contents: write
jobs:
  debug:
    if: ${{ !contains(github.event.head_commit.message, '[debug-output]') }}
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server/local}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/v17-modifier-chain-ui}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pymorphy3 pymorphy3-dicts-ru
      - name: Исправить словоизменение и записать результат
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('v16_rules.py')
          text = path.read_text(encoding='utf-8')
          old = '''                target = self.morph.inflect_modifier(source, head_parse)
                if target and target.casefold() != source.casefold():
                    proposals.add((mismatch.start(), target))'''
          new = '''                target = self.morph.inflect_modifier(source, head_parse)
                if not target and head_features.case != "accs":
                    grammemes = {value for value in (
                        head_features.case, head_features.number,
                        head_features.gender if head_features.number != "plur" else None,
                    ) if value}
                    forms = self.morph.inflected_forms(source, grammemes)
                    forms = {
                        preserve_capitalization(source, preserve_yo(source, form))
                        for form in forms
                        if form.casefold() != source.casefold()
                    }
                    if len(forms) == 1:
                        target = forms.pop()
                if target and target.casefold() != source.casefold():
                    proposals.add((mismatch.start(), target))'''
          if text.count(old) != 1:
              raise SystemExit('Не найден блок словоизменения')
          path.write_text(text.replace(old, new), encoding='utf-8')

          from decision_engine import DecisionEngine
          from morphology import features, get_morphology
          from v16_rules import V16RuleExtension
          morph = get_morphology()
          rules = V16RuleExtension(morph)
          sample = 'актуализации сведений о регистрационных\nданных несъемных жесткого\nмагнитных дисков'
          candidates = rules.candidates(sample)
          corrected, accepted = DecisionEngine(min_confidence=0.55).apply(sample, candidates)
          lines = [
              repr([(c.before, c.after, c.category, c.start) for c in candidates]),
              repr(corrected),
              repr([(c.before, c.after) for c in accepted]),
          ]
          Path('../../v17-debug.txt').write_text('\n'.join(lines), encoding='utf-8')
          if 'жестких' not in corrected:
              raise SystemExit('Ожидаемое исправление не сформировано')
          PY
      - name: Зафиксировать проверенное исправление
        working-directory: .
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/local/v16_rules.py v17-debug.txt
          git commit -m 'fix: согласовать определение с формой существительного [debug-output]'
          git push
