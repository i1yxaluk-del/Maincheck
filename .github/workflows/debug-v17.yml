name: patch-morphology-once
on:
  push:
    branches: [fix/v17-modifier-chain-ui]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[morphology-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/v17-modifier-chain-ui}
      - name: Учитывать одушевлённость только в винительном падеже
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/local/morphology.py')
          text = path.read_text(encoding='utf-8')
          old = 'if f.animacy and (f.case == "accs" or f.number == "plur"):'
          new = 'if f.animacy and f.case == "accs":'
          if text.count(old) != 1:
              raise SystemExit(f'Ожидалось одно совпадение, найдено {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Проверить и зафиксировать
        run: |
          python -m pip install -q pytest pymorphy3 pymorphy3-dicts-ru
          cd server/local
          pytest -q test_v15_regressions.py test_v16_regressions.py test_coverage_policy.py
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/local/morphology.py
          git commit -m 'fix: не передавать одушевленность вне винительного падежа [morphology-patched]'
          git push
