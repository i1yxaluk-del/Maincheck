name: local-server

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/local
    env:
      PYTHONPATH: ${{ github.workspace }}/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest httpx pymorphy3 pymorphy3-dicts-ru
      - run: >-
          python -m py_compile decision_app.py decision_app_v10.py decision_app_v11.py
          decision_engine.py hybrid_editor.py morphology.py np_agreement.py spellcheck.py
          verification.py segmentation.py llm_text.py languagetool_stage.py ollama_gec.py
          russian_quality_models.py safe_diff.py syntax_candidates.py local_rules.py v10_rules.py
          v15_rules.py client_safe_edits.py reasoning_cascade.py punctuation_pipeline.py rupunct_stage.py
      - run: pytest -q test_v9_agreement.py test_v9_pipeline.py test_v10_regressions.py
      - run: pytest -q test_reasoning_cascade.py test_rupunct_stage.py test_punctuation_pipeline.py test_structural_punctuation.py
      - run: pytest -q test_punctuation_corpus.py
      - run: pytest -q test_v31.py test_hybrid_editor.py test_pipelines.py

  v15-format-protocol:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server/local}}
    env: {PYTHONPATH: "${{ github.workspace }}/server"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest pymorphy3 pymorphy3-dicts-ru
      - run: pytest -q test_v15_regressions.py -k 'punctuation_deletion or non_deletion'

  v15-full-example:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server/local}}
    env: {PYTHONPATH: "${{ github.workspace }}/server"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest pymorphy3 pymorphy3-dicts-ru
      - run: pytest -q test_v15_regressions.py -k full_report

  v15-compound:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server/local}}
    env: {PYTHONPATH: "${{ github.workspace }}/server"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest pymorphy3 pymorphy3-dicts-ru
      - run: pytest -q test_v15_regressions.py -k 'compound_agreement or correct_compound'

  v15-coordinator:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server/local}}
    env: {PYTHONPATH: "${{ github.workspace }}/server"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest pymorphy3 pymorphy3-dicts-ru
      - run: pytest -q test_v15_regressions.py -k comma_before_single

  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/local
    env:
      PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/server/local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pymorphy3 pymorphy3-dicts-ru
      - run: python -m eval.run_eval --max-fp 0 --min-exact 16 --verbose
