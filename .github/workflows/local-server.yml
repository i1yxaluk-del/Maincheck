name: local-server

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/local
    env:
      PYTHONPATH: ${{ github.workspace }}/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test deps
        run: python -m pip install --upgrade pip pytest httpx pymorphy3 pymorphy3-dicts-ru
      - name: Compile application
        run: >-
          python -m py_compile decision_app.py decision_app_v10.py decision_engine.py hybrid_editor.py
          morphology.py np_agreement.py spellcheck.py verification.py segmentation.py
          llm_text.py languagetool_stage.py ollama_gec.py russian_quality_models.py
          safe_diff.py syntax_candidates.py local_rules.py v10_rules.py qwen35_backend.py
          russian_gec_backend.py
      - name: Run v9 agreement regressions
        run: pytest -q test_v9_agreement.py
      - name: Run v9 pipeline regressions
        run: pytest -q test_v9_pipeline.py
      - name: Run v10 production regressions
        run: pytest -q test_v10_regressions.py
      - name: Run deterministic regressions
        run: pytest -q test_v31.py
      - name: Run bounded diff regressions
        run: pytest -q test_hybrid_editor.py
      - name: Run legacy regressions
        run: pytest -q test_pipelines.py

  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/local
    env:
      PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/server/local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic deps
        run: python -m pip install --upgrade pip pymorphy3 pymorphy3-dicts-ru
      - name: Offline quality evaluation
        run: python -m eval.run_eval --max-fp 0 --min-exact 16 --verbose
