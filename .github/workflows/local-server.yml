name: local-server

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test deps
        run: python -m pip install --upgrade pip pytest httpx pymorphy3 pymorphy3-dicts-ru
      - name: Compile application
        run: python -m py_compile decision_app.py decision_engine.py pipelines.py
      - name: Run pipeline regressions
        run: pytest -q test_pipelines.py
